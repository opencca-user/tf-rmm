name: opencca-build

# CI Build script for tf-rmm

on:
  push:
    branches: [opencca/main]
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.workflow }}
  cancel-in-progress: true

env:
  CI_REPO: https://github.com/opencca/ci-scripts
  CI_RUN_SCRIPT: run-ci.sh
  CI_BUILD_SCRIPT: build-tf-rmm.sh

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          path: tf-rmm

      - name: Clone and run CI
        run: |
          git clone --depth 1 "$CI_REPO" .ci
          cd .ci
          $CI_RUN_SCRIPT "$GITHUB_WORKSPACE" "$CI_BUILD_SCRIPT"

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tf-rmm-snapshot
          path: snapshot/tf-rmm.elf
          if-no-files-found: error