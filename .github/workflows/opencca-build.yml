name: opencca-build

on:
  push:
    branches: [opencca/main]
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.workflow }}
  cancel-in-progress: true

env:
  CI_REPO: https://github.com/opencca-user/ci-scripts
  CI_DIR: .ci-scripts
  CI_RUN_SCRIPT: run-ci.sh
  CI_BUILD_SCRIPT: build-tf-rmm.sh
  
  SNAPSHOT_DIR: ${{ github.workspace }}/snapshot
  


jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          path: ${{ github.event.repository.name }}

      - name: Clone CI scripts
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 "$CI_REPO" "$CI_DIR"
          chmod +x "$CI_DIR/run-ci.sh"

      - name: Run CI runner with build script
        run: |
          "$CI_DIR/run-ci.sh" "$GITHUB_WORKSPACE" "$CI_DIR/$CI_BUILD_SCRIPT"

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tf-rmm-snapshot
          path: ${{ env.SNAPSHOT_DIR }}/tf-rmm.elf
          if-no-files-found: error