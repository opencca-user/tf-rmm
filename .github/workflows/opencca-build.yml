name: opencca-build

on:
  push:
    branches:
      - opencca/main
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.workflow }}
  cancel-in-progress: true

env:
  PROJ_ROOT: ${{ github.workspace }}
  REPO_SUBDIR: tf-rmm
  REPO_DIR: ${{ github.workspace }}/tf-rmm
  BUILD_SCRIPT: ${{ github.workspace }}/tf-rmm/.github/workflows/opencca/opencca-build.sh
  SNAPSHOT_DIR: ${{ github.workspace }}/snapshot

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          path: ${{ env.REPO_SUBDIR }}

      - name: Run build script
        run: |
          cd "$PROJ_ROOT"

          rm -rf "$SNAPSHOT_DIR"
          mkdir -p "$SNAPSHOT_DIR"

          cp -f "$REPO_DIR/.github/workflows/opencca/run-in-docker.sh" .
          chmod +x run-in-docker.sh
          ./run-in-docker.sh "$BUILD_SCRIPT"

          ls -al "$SNAPSHOT_DIR"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-rmm-snapshot
          path: snapshot/tf-rmm.elf
          if-no-files-found: error