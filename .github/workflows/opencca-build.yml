name: opencca-build

on:
  push:
    branches:
      - opencca/main
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.workflow }}
  cancel-in-progress: true

env:
  REPO_DIR: ${{ github.workspace }}/tf-rmm
  BUILD_SCRIPT: ${{ env.REPO_DIR }}/.github/workflows/opencca/opencca-build.sh
  PROJ_ROOT: ${{ github.workspace }}
  SNAPSHOT_DIR: ${{ github.workspace }}/snapshot


jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          path: tf-rmm

      - name: Run build script
        run: |
          cd $PROJ_ROOT
          cp -rf $REPO_DIR/./.github/workflows/opencca/run-in-docker.sh $PROJ_ROOT/
          chmod +x run-in-docker.sh

          rm -r $SNAPTHOT_DIR
          mkdir -p $SNAPSHOT_DIR

          ./run-in-docker.sh $BUILD_SCRIPT
          ls -al
          ls -al $SNAPSHOT_DIR

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tf-rmm-snapshot
          path: ${{ env.SNAPSHOT_DIR }}/tf-rmm.elf
          if-no-files-found: error
